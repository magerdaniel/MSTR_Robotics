[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MSTR-Robotics-magerdaniel"
version = "0.5.6"
description = "Automation toolkit for MicroStrategy / Strategy One: object read-out, migration, comparison, RAG and OSI export."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Daniel Mager", email = "danielmager@gmx.de" }]
# Base install: connection, object read-out, comparison and migration. Kept small on
# purpose; feature-specific libraries live in the extras below. (openpyxl is base because
# the migration notebook reads its input list from an .xlsx via pandas.)
dependencies = [
    "mstrio-py>=11.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Chat / RAG notebooks: OpenAI + Perplexity (OpenAI-compatible) and keyword extraction.
rag = [
    "openai>=1.0",
    "flashtext>=2.7",
]
# Redis-backed metadata analysis.
redis = [
    "redis>=5.0",
]
# Azure Blob staging for migration packages.
azure = [
    "azure-storage-blob>=12.0",
]
# MCP servers (mstr_robotics/mcp_servers/) — the report-wizard tool uses the RAG stack.
servers = [
    "mcp",
    "MSTR-Robotics-magerdaniel[rag]",
]
# Everything above.
all = [
    "MSTR-Robotics-magerdaniel[rag,redis,azure,servers]",
]
dev = [
    "ruff",
    "vulture",
    "jupyter",
]

[tool.setuptools]
packages = [
    "mstr_robotics",
    "mstr_robotics.mcp_servers",
    "mstr_robotics.osi_exporter",
    "mstr_robotics.utils.notebooks",
    "mstr_robotics.utils.config",
    "mstr_robotics.utils.docs",
    "mstr_robotics.utils.OSI_Produktion",
]

# Repo layout keeps notebooks/, config/, docs/, OSI_Produktion/ at project level;
# these map them into mstr_robotics/utils/ only inside the built package, so
# `pip install`ers get a self-contained, copy-pasteable bundle of reference
# material alongside the code.
[tool.setuptools.package-dir]
"mstr_robotics.utils.notebooks" = "notebooks"
"mstr_robotics.utils.config" = "config"
"mstr_robotics.utils.docs" = "docs"
"mstr_robotics.utils.OSI_Produktion" = "OSI_Produktion"

[tool.setuptools.package-data]
"mstr_robotics.utils.notebooks" = ["*.ipynb"]
"mstr_robotics.utils.config" = ["*.example.*"]
"mstr_robotics.utils.docs" = ["*.md"]
"mstr_robotics.utils.OSI_Produktion" = ["*.yml"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "alt",
    "Dansfiles",
    "notebooks_BAK",
    "notebooks_dev",
    "OSI_Produktion",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, N: pep8-naming, B: bugbear (mutable defaults etc.)
select = ["E", "F", "W", "I", "N", "B"]
ignore = [
    # long string literals / comments; the formatter governs code line length
    "E501",
    # deliberate lazy imports of optional deps (mstrio, openai, azure)
    "E402",
    # star-arg unpacking after keyword arg — widespread call pattern, defer to v0.6
    "B026",
    # method/argument/variable renames (open_Instance, sKey, ...) deferred to v0.6;
    # v0.5 scope was class and module names only
    "N802", "N803", "N806",
]
