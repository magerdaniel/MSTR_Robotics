[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MSTR-Robotics-magerdaniel"
# Single source of truth is mstr_robotics/__init__.py; see [tool.setuptools.dynamic]
# below. Keeping the number in two places let 0.5.9 ship with __version__ = "0.5.8".
dynamic = ["version"]
description = "Automation toolkit for MicroStrategy / Strategy One: object read-out, migration, comparison, RAG and OSI export."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Daniel Mager", email = "danielmager@gmx.de" }]
# Base install: connection, object read-out, comparison and migration. Kept small on
# purpose; feature-specific libraries live in the extras below. (openpyxl is base because
# the migration notebook reads its input list from an .xlsx via pandas.)
dependencies = [
    "mstrio-py>=11.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Chat / RAG notebooks: OpenAI + Perplexity (OpenAI-compatible) and keyword extraction.
rag = [
    "openai>=1.0",
    "flashtext>=2.7",
]
# Redis-backed metadata analysis.
redis = [
    "redis>=5.0",
]
# Azure Blob staging for migration packages.
azure = [
    "azure-storage-blob>=12.0",
]
# MCP servers (mstr_robotics/mcp_servers/) — the report-wizard tool uses the RAG stack.
# mcp is capped below 2.0: that release dropped mcp.server.fastmcp, which
# mcp_servers/mstr_osi_mcp.py imports. Unpinned, a fresh install pulls 2.x and the
# server dies at import with ModuleNotFoundError.
servers = [
    "mcp>=1.6,<2",
    "MSTR-Robotics-magerdaniel[rag]",
]
# Everything above.
all = [
    "MSTR-Robotics-magerdaniel[rag,redis,azure,servers]",
]
dev = [
    "ruff",
    "vulture",
    "jupyter",
]

[tool.setuptools.dynamic]
version = { attr = "mstr_robotics.__version__" }

[tool.setuptools]
packages = [
    "mstr_robotics",
    "mstr_robotics.mcp_servers",
    "mstr_robotics.osi_exporter",
    "mstr_robotics.utils.notebooks",
    "mstr_robotics.utils.config",
    "mstr_robotics.utils.docs",
    "mstr_robotics.utils.examples",
    "mstr_robotics.utils.OSI_production",
    "mstr_robotics.utils.OM_packages",
    "mstr_robotics.utils.osi_templates",
    "mstr_robotics.utils.custom_code",
]

# Repo layout keeps notebooks/, config/, docs/, examples/, OSI_production/,
# OM_packages/ and osi_templates/ at project level; these map them into
# mstr_robotics/utils/ only inside the built package, so `pip install`ers get a
# self-contained, copy-pasteable bundle of reference material alongside the code.
# Copying that utils/ tree up into your own project folder is step 4 of the
# install guide in README.md.
[tool.setuptools.package-dir]
"mstr_robotics.utils.notebooks" = "notebooks"
"mstr_robotics.utils.config" = "config"
"mstr_robotics.utils.docs" = "docs"
"mstr_robotics.utils.examples" = "examples"
"mstr_robotics.utils.OSI_production" = "OSI_production"
"mstr_robotics.utils.OM_packages" = "OM_packages"
"mstr_robotics.utils.osi_templates" = "osi_templates"
"mstr_robotics.utils.custom_code" = "custom_code"

# config/ ships example files only — never a populated user_d.yml or API_KEY.env.
[tool.setuptools.package-data]
"mstr_robotics.utils.notebooks" = ["*.ipynb"]
"mstr_robotics.utils.config" = ["*.example.*"]
"mstr_robotics.utils.docs" = ["*.md"]
"mstr_robotics.utils.examples" = ["*.csv", "*.py"]
"mstr_robotics.utils.OSI_production" = ["*.yml"]
"mstr_robotics.utils.OM_packages" = ["*.zip", "*.mmp"]
"mstr_robotics.utils.osi_templates" = ["*.json"]
"mstr_robotics.utils.custom_code" = ["*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".venv",
    "alt",
    "Dansfiles",
    "notebooks_BAK",
    "notebooks_dev",
    "OSI_production",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, N: pep8-naming, B: bugbear (mutable defaults etc.)
select = ["E", "F", "W", "I", "N", "B"]
ignore = [
    # long string literals / comments; the formatter governs code line length
    "E501",
    # deliberate lazy imports of optional deps (mstrio, openai, azure)
    "E402",
    # star-arg unpacking after keyword arg — widespread call pattern, defer to v0.6
    "B026",
    # method/argument/variable renames (open_Instance, sKey, ...) deferred to v0.6;
    # v0.5 scope was class and module names only
    "N802", "N803", "N806",
]
