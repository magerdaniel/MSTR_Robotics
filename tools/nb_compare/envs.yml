# The two environments expected to produce identical results.
# Each notebook is executed by THAT environment's own venv python, with the
# working directory set to <root>/notebooks so its ..\config\user_d.json applies.
env1:
  name: env1
  root: C:/coding/Python_environments/mstr_robotics
  python: C:/coding/Python_environments/mstr_robotics/.venv/Scripts/python.exe
env2:
  name: env2
  root: C:/coding/Python_environments/mstr_robotics_comp
  python: C:/coding/Python_environments/mstr_robotics_comp/.venv/Scripts/python.exe
